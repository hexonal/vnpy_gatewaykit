[project]
name = "vnpy_gatewaykit"
version = "0.1.0"
description = "Broker-agnostic mixins for VeighNa (vnpy) gateway implementations — plumbing extracted from vnpy_futu, meant to be reused by future gateway packages (e.g. vnpy_longbridge)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vnpy_gatewaykit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Point pyright at the shared VeighNa virtualenv. Without it, every vnpy import
# resolves against the system interpreter and reports as unresolved, burying the
# real diagnostics. Relative so it travels with the checkout: this package sits
# beside the vnpy fork that owns the venv.
[tool.pyright]
venvPath = ".."
venv = "vnpy/.venv"
typeCheckingMode = "standard"

# 显式钉住 lint 目标版本，不要落到仓外去找配置。
#
# 本仓没有这一段时，ruff 会沿目录树往上找，在开发机上读到
# /Users/flink/tradingview/pyproject.toml（那份写的是 requires-python >=3.12），
# 而 CI 里根本没有那个父目录，于是同一份代码在两处得到不同的诊断
# （实测：py310 目标 8 条，py312 目标 13 条）。更糟的是 UP017 会在 py312 下
# 建议把 timezone.utc 换成 datetime.UTC —— 后者是 CPython 3.11 才有的，
# 而本仓 requires-python 写的是 >=3.10，照做会让包在它自己声称支持的
# 最老解释器上 import 就崩。
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "SIM", "UP", "I"]
